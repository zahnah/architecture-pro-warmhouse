syntax = "proto3";

package warmhouse.telemetry.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Telemetry Service API"
    version: "1.0.0"
    license: {name: "MIT" url: "https://opensource.org/licenses/MIT"}
    description: "Последние значения, история показаний и история доступности устройств. Только чтение: данные приходят из Kafka-топиков telemetry.reading и device.connectivity.changed (AsyncAPI event-bus.yaml). Legacy Monolith на период миграции вызывает GetLatestReadings по gRPC напрямую. История остаётся доступной после отвязки устройства, пока не истечёт срок хранения."
  }
  host: "api.warmhouse.example"
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT: Bearer <token>"
      }
    }
  }
  security: {
    security_requirement: {
      key: "bearer"
      value: {}
    }
  }
  responses: {
    key: "401"
    value: {
      description: "Нет или неверный токен"
      schema: {json_schema: {ref: ".google.rpc.Status"}}
    }
  }
  responses: {
    key: "403"
    value: {
      description: "Нет доступа к устройству или дому"
      schema: {json_schema: {ref: ".google.rpc.Status"}}
    }
  }
  responses: {
    key: "404"
    value: {
      description: "Данных по устройству нет"
      schema: {json_schema: {ref: ".google.rpc.Status"}}
    }
  }
};

// Показания и история доступности устройств.
service TelemetryService {
  // Последнее значение каждой метрики устройства
  rpc GetLatestReadings(GetLatestReadingsRequest) returns (GetLatestReadingsResponse) {
    option (google.api.http) = {get: "/api/v2/devices/{device_id}/readings/latest"};
  }

  // История метрики устройства.
  //
  // Без interval возвращает сырые показания, с interval — агрегаты по интервалам (TimescaleDB time_bucket).
  rpc ListReadings(ListReadingsRequest) returns (ReadingSeries) {
    option (google.api.http) = {get: "/api/v2/devices/{device_id}/readings"};
  }

  // Последние значения по всем устройствам дома
  rpc GetHomeLatestReadings(GetHomeLatestReadingsRequest) returns (GetHomeLatestReadingsResponse) {
    option (google.api.http) = {get: "/api/v2/homes/{home_id}/readings/latest"};
  }

  // Смены статуса «в сети / не в сети» за период
  rpc ListAvailability(ListAvailabilityRequest) returns (ListAvailabilityResponse) {
    option (google.api.http) = {get: "/api/v2/devices/{device_id}/availability"};
  }
}

message Reading {
  string device_id = 1;
  string metric = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"temperature\""}];
  double value = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "21.4"}];
  string unit = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {example: "\"celsius\""}];
  google.protobuf.Timestamp time = 5;
}

message GetLatestReadingsRequest {
  string device_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetLatestReadingsResponse {
  repeated Reading items = 1;
}

enum AggregationInterval {
  // Без агрегации — сырые показания
  AGGREGATION_INTERVAL_UNSPECIFIED = 0;
  AGGREGATION_INTERVAL_1M = 1;
  AGGREGATION_INTERVAL_5M = 2;
  AGGREGATION_INTERVAL_1H = 3;
  AGGREGATION_INTERVAL_1D = 4;
}

message ListReadingsRequest {
  string device_id = 1 [(google.api.field_behavior) = REQUIRED];
  string metric = 2 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp from = 3 [(google.api.field_behavior) = REQUIRED];
  // По умолчанию — текущий момент
  google.protobuf.Timestamp to = 4;
  AggregationInterval interval = 5;
  // По умолчанию 1000, не больше 10000
  int32 limit = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    minimum: 1
    maximum: 10000
  }];
}

message SeriesPoint {
  // Время показания или начало интервала
  google.protobuf.Timestamp time = 1;
  // Значение или среднее за интервал
  double value = 2;
  google.protobuf.DoubleValue min = 3;
  google.protobuf.DoubleValue max = 4;
}

// Ряд значений по возрастанию времени
message ReadingSeries {
  string device_id = 1;
  string metric = 2;
  string unit = 3;
  AggregationInterval interval = 4;
  repeated SeriesPoint points = 5;
}

message GetHomeLatestReadingsRequest {
  string home_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Фильтр по метрике
  string metric = 2;
}

message GetHomeLatestReadingsResponse {
  repeated Reading items = 1;
}

message ListAvailabilityRequest {
  string device_id = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp from = 2 [(google.api.field_behavior) = REQUIRED];
  // По умолчанию — текущий момент
  google.protobuf.Timestamp to = 3;
  int32 limit = 4;
}

message AvailabilityChange {
  google.protobuf.Timestamp time = 1;
  bool online = 2;
}

message ListAvailabilityResponse {
  string device_id = 1;
  // По возрастанию времени
  repeated AvailabilityChange items = 2;
}
